<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二択の質問</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      color: #26211d;
      background:
        linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.78)),
        url("https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1600&q=80") center / cover;
    }

    main {
      position: relative;
      width: min(92vw, 520px);
      min-height: 255px;
      padding: 36px 28px;
      border: 1px solid rgba(97, 78, 60, 0.2);
      border-radius: 8px;
      background: rgba(255, 252, 247, 0.92);
      box-shadow: 0 20px 55px rgba(54, 40, 29, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .choices {
      position: relative;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      min-height: 150px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease, left 180ms ease, top 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(54, 40, 29, 0.18);
    }

    button:active {
      transform: translateY(0);
      opacity: 0.86;
    }

    .yes {
      color: #fff;
      background: #2f7d68;
    }

    .no {
      position: absolute;
      top: 0;
      right: 0;
      width: calc(50% - 7px);
      color: #3b3028;
      background: #ead8c4;
    }

    #answer {
      min-height: 1.8em;
      margin: 22px 0 0;
      font-size: 1rem;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      main {
        padding: 30px 20px;
      }

      .choices {
        grid-template-columns: 1fr;
        min-height: 138px;
      }

      .no {
        width: 100%;
        top: 70px;
        right: auto;
        left: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>まーちゃんに手紙を書いてくれる？</h1>
    <div class="choices" aria-label="回答を選んでください">
      <button class="yes" type="button" data-message="ありがとう。まーちゃん、きっと喜ぶよ。">いいよ</button>
      <button class="no" type="button" data-message="そっか。また気が向いたらお願いね。">むり</button>
    </div>
    <p id="answer" role="status" aria-live="polite"></p>
  </main>

  <script>
    const answer = document.querySelector("#answer");
    const choices = document.querySelector(".choices");
    const yesButton = document.querySelector(".yes");
    const noButton = document.querySelector(".no");

    function overlapsYesButton(left, top, width, height) {
      const area = choices.getBoundingClientRect();
      const yes = yesButton.getBoundingClientRect();
      const candidate = {
        left: area.left + left,
        top: area.top + top,
        right: area.left + left + width,
        bottom: area.top + top + height
      };

      return !(
        candidate.right < yes.left ||
        candidate.left > yes.right ||
        candidate.bottom < yes.top ||
        candidate.top > yes.bottom
      );
    }

    function moveNoButton(pointerX, pointerY) {
      const area = choices.getBoundingClientRect();
      const button = noButton.getBoundingClientRect();
      const maxLeft = Math.max(0, area.width - button.width);
      const maxTop = Math.max(0, area.height - button.height);
      const padding = 8;
      let bestSpot = { left: 0, top: 0, distance: -1 };

      for (let i = 0; i < 24; i += 1) {
        const left = padding + Math.random() * Math.max(0, maxLeft - padding * 2);
        const top = padding + Math.random() * Math.max(0, maxTop - padding * 2);

        if (overlapsYesButton(left, top, button.width, button.height)) {
          continue;
        }

        const centerX = area.left + left + button.width / 2;
        const centerY = area.top + top + button.height / 2;
        const distance = Math.hypot(centerX - pointerX, centerY - pointerY);

        if (distance > bestSpot.distance) {
          bestSpot = { left, top, distance };
        }
      }

      noButton.style.left = `${Math.min(maxLeft, bestSpot.left)}px`;
      noButton.style.top = `${Math.min(maxTop, bestSpot.top)}px`;
      noButton.style.right = "auto";
    }

    function pointerNearNoButton(event) {
      const button = noButton.getBoundingClientRect();
      const pointerX = event.clientX;
      const pointerY = event.clientY;
      const centerX = button.left + button.width / 2;
      const centerY = button.top + button.height / 2;
      const distance = Math.hypot(centerX - pointerX, centerY - pointerY);

      if (distance < 115) {
        moveNoButton(pointerX, pointerY);
      }
    }

    document.addEventListener("pointermove", pointerNearNoButton);
    noButton.addEventListener("pointerenter", (event) => {
      moveNoButton(event.clientX, event.clientY);
    });
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopImmediatePropagation();
      moveNoButton(event.clientX, event.clientY);
    });

    document.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        if (button === noButton) {
          return;
        }

        answer.textContent = button.dataset.message;
      });
    });
  </script>
</body>
</html>
