<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>二択の質問</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Yu Gothic", "Hiragino Sans", "Meiryo", sans-serif;
      color: #26211d;
      background:
        linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.78)),
        url("https://images.unsplash.com/photo-1519682337058-a94d519337bc?auto=format&fit=crop&w=1600&q=80") center / cover;
    }

    main {
      width: min(92vw, 520px);
      padding: 36px 28px;
      border: 1px solid rgba(97, 78, 60, 0.2);
      border-radius: 8px;
      background: rgba(255, 252, 247, 0.92);
      box-shadow: 0 20px 55px rgba(54, 40, 29, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(1.7rem, 4vw, 2.5rem);
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      font: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(54, 40, 29, 0.18);
    }

    button:active {
      transform: translateY(0);
      opacity: 0.86;
    }

    .yes {
      color: #fff;
      background: #2f7d68;
    }

    .no {
      color: #3b3028;
      background: #ead8c4;
    }

    #answer {
      min-height: 1.8em;
      margin: 22px 0 0;
      font-size: 1rem;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      main {
        padding: 30px 20px;
      }

      .choices {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>まーちゃんに手紙を書いてくれる？</h1>
    <div class="choices" aria-label="回答を選んでください">
      <button class="yes" type="button" data-message="ありがとう。まーちゃん、きっと喜ぶよ。">いいよ</button>
      <button class="no" type="button" data-message="そっか。また気が向いたらお願いね。">むり</button>
    </div>
    <p id="answer" role="status" aria-live="polite"></p>
  </main>

  <script>
    const answer = document.querySelector("#answer");
    document.querySelectorAll("button").forEach((button) => {
      button.addEventListener("click", () => {
        answer.textContent = button.dataset.message;
      });
    });
  </script>
</body>
</html>
